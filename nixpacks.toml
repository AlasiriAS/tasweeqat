[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl"]

[phases.install]
cmds = ["node -e \"const fs=require('fs');const l=JSON.parse(fs.readFileSync('package-lock.json'));for(const k of Object.keys(l.packages)){const p=l.packages[k];if(!p.version&&!p.resolved&&!p.link)delete l.packages[k];}fs.writeFileSync('package-lock.json',JSON.stringify(l));\" && npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm start"
