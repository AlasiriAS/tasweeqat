[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl"]

[phases.install]
cmds = ["npm install --legacy-peer-deps || (echo '=== NPM DEBUG LOG ===' && cat /root/.npm/_logs/*.log 2>/dev/null | tail -80 && exit 1)"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm start"
